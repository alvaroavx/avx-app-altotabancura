name: alto-tabancura-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-CU32-GDR12-ubuntu-20.04
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
      - ./data:/var/opt/mssql/backup:ro
    networks:
      - laboratory
    shm_size: 1gb
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -No -Q "SELECT 1" -b >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_DEBUG: ${APP_DEBUG}
      APP_DB_HOST: ${APP_DB_HOST}
      APP_DB_PORT: ${APP_DB_PORT}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_OUTPUT_DIR: ${APP_OUTPUT_DIR}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html
      - generated-files:/var/www/generated
    networks:
      - laboratory
      - frontend
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql-data:
  generated-files:

networks:
  laboratory:
    internal: true
  frontend:
    driver: bridge
